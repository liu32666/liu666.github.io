<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資產戰情儀表板</title>
    <style>
        :root { --bg: #0b1120; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --text-muted: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 450px; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        input { background: #0f172a; border: 1px solid #475569; color: var(--accent); padding: 10px; border-radius: 10px; width: 50%; text-align: right; font-weight: 600; }
        .btn { width: 100%; padding: 18px; background: #38bdf8; border: none; border-radius: 16px; color: #0b1120; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-box { background: #0f172a; padding: 16px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-top: 4px; }
        .action-card { background: rgba(56,189,248,0.1); padding: 20px; border-radius: 16px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
<div class="dashboard">
    <h2>資產再平衡導航</h2>
    <div class="card">
        <div class="input-row"><label>信貸總額</label><input type="number" id="loan" value="1800000"></div>
        <div class="input-row"><label>正二股價</label><input type="number" id="price" value="310.3"></div>
        <div class="input-row"><label>持有股數</label><input type="number" id="shares" value="4223.7"></div>
        <div class="input-row"><label>目前現金</label><input type="number" id="cash" value="720000"></div>
        <div class="input-row"><label>目標股票%</label><input type="number" id="target" value="60"></div>
    </div>
    <button class="btn" onclick="calc()">執行再平衡計算</button>
    <div class="card">
        <div class="stat-grid">
            <div class="stat-box"><small>總市值</small><div class="stat-val" id="valMarket">$0</div></div>
            <div class="stat-box"><small>實質槓桿</small><div class="stat-val" id="valLev">0.00</div></div>
        </div>
        <div class="action-card">
            <div id="actionText" style="font-size:1.1rem; font-weight:800; color:var(--accent);">等待計算...</div>
            <div id="cashChange" style="font-size:0.9rem; color:var(--text-muted); margin-top:10px;"></div>
            <div id="newCashTotal" style="font-size:0.9rem; font-weight:bold; color:#22c55e; margin-top:5px;"></div>
        </div>
    </div>
</div>
<script>
    function calc() {
        const p = parseFloat(document.getElementById('price').value);
        const s = parseFloat(document.getElementById('shares').value);
        const c = parseFloat(document.getElementById('cash').value);
        const tr = parseFloat(document.getElementById('target').value) / 100;
        const market = p * s;
        const total = market + c;
        const diff = (total * tr) - market;
        
        document.getElementById('valMarket').innerText = '$' + Math.round(market).toLocaleString();
        document.getElementById('valLev').innerText = ((market * 2) / total).toFixed(2);
        
        const sharesNeeded = Math.abs(diff / p).toFixed(1);
        const cashValue = Math.abs(Math.round(diff)).toLocaleString();
        const newCash = Math.round(c - diff).toLocaleString();

        if (Math.abs(diff) < 100) {
            document.getElementById('actionText').innerText = "無需變動";
        } else if (diff > 0) {
            document.getElementById('actionText').innerText = `買進 ${sharesNeeded} 股`;
            document.getElementById('cashChange').innerText = `需花費現金：$${cashValue}`;
            document.getElementById('newCashTotal').innerText = `執行後現金餘額：$${newCash}`;
        } else {
            document.getElementById('actionText').innerText = `賣出 ${sharesNeeded} 股`;
            document.getElementById('cashChange').innerText = `換回現金：$${cashValue}`;
            document.getElementById('newCashTotal').innerText = `執行後現金水位：$${newCash}`;
        }
    }
</script>
</body>
</html>
