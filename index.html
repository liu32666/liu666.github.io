<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資產再平衡導航</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #0f172a;
            --text-body: #475569;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        body { background: var(--bg); color: var(--text-body); font-family: 'Inter', system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        h2 { color: var(--text-title); font-size: 1.25rem; margin-bottom: 16px; }
        
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-title); }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; }
        
        .btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        
        .output-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .output-label { font-size: 0.9rem; }
        .output-value { font-weight: 700; color: var(--text-title); }
        
        .rebalance-box { background: #eff6ff; padding: 16px; border-radius: 12px; margin-top: 16px; text-align: center; }
        .rebalance-text { font-weight: 800; font-size: 1.1rem; color: var(--primary); margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2>資產再平衡導航儀</h2></div>
    
    <div class="card">
        <div class="input-group"><label>信貸總額</label><input type="number" id="loan" value="1800000"></div>
        <div class="input-group"><label>今日正二股價</label><input type="number" id="price" value="310.3"></div>
        <div class="input-group"><label>持有股數</label><input type="number" id="shares" value="4223.7"></div>
        <div class="input-group"><label>銀行活存現金</label><input type="number" id="cash" value="720000"></div>
        <div class="input-group"><label>目標股票比例 (%)</label><input type="number" id="targetRatio" value="60"></div>
    </div>

    <button class="btn" onclick="calc()">計算再平衡策略</button>

    <div class="card" style="margin-top:20px;">
        <h2>戰略儀表板</h2>
        <div class="output-item"><span class="output-label">當前市值</span><span class="output-value" id="valMarket">$0</span></div>
        <div class="output-item"><span class="output-label">實質槓桿</span><span class="output-value" id="valLev">0.00</span></div>
        <div class="rebalance-box">
            <div class="output-label">再平衡決策</div>
            <div class="rebalance-text" id="valAction">等待計算...</div>
        </div>
    </div>
</div>

<script>
    function calc() {
        const p = parseFloat(document.getElementById('price').value);
        const s = parseFloat(document.getElementById('shares').value);
        const c = parseFloat(document.getElementById('cash').value);
        const target = parseFloat(document.getElementById('targetRatio').value) / 100;
        
        const market = p * s;
        const total = market + c;
        const lev = (market * 2) / total;
        
        document.getElementById('valMarket').innerText = '$' + Math.round(market).toLocaleString();
        document.getElementById('valLev').innerText = lev.toFixed(2);
        
        const ideal = total * target;
        const diff = ideal - market;
        const shares = Math.abs(diff) / p;
        
        const action = diff > 0 ? "買進" : "賣出";
        const color = diff > 0 ? "#2563eb" : "#c2410c";
        
        document.getElementById('valAction').innerHTML = 
            `<span style="color:${color}">${action} ${shares.toFixed(1)} 股<br>約 $${Math.abs(Math.round(diff)).toLocaleString()}</span>`;
    }
</script>
</body>
</html>
