<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Trader Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 450px; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        input { background: #0f172a; border: 1px solid #475569; color: var(--accent); padding: 10px; border-radius: 8px; width: 40%; text-align: right; font-weight: bold; }
        .btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; border-radius: 16px; color: white; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>
<div class="dashboard">
    <h2 style="text-align:center; margin-bottom:20px;">ASSET NAVIGATOR</h2>
    <div class="card">
        <div class="input-row"><label>信貸總額</label><input type="number" id="loan" value="1800000"></div>
        <div class="input-row"><label>股價</label><input type="number" id="price" value="310.3"></div>
        <div class="input-row"><label>股數</label><input type="number" id="shares" value="4223.7"></div>
        <div class="input-row"><label>現金</label><input type="number" id="cash" value="720000"></div>
    </div>
    <button class="btn" onclick="calc()">CALCULATE STRATEGY</button>
    <div class="card">
        <div class="stat-grid">
            <div class="stat-box"><small>當前市值</small><div class="stat-val" id="valMarket">$0</div></div>
            <div class="stat-box"><small>實質槓桿</small><div class="stat-val" id="valLev">0.00</div></div>
        </div>
        <div id="actionBox" style="margin-top:20px; padding:20px; background:rgba(56,189,248,0.1); border-radius:16px; text-align:center;">
            等待執行策略...
        </div>
    </div>
</div>
<script>
    function calc() {
        const p = parseFloat(document.getElementById('price').value);
        const s = parseFloat(document.getElementById('shares').value);
        const c = parseFloat(document.getElementById('cash').value);
        const market = p * s;
        const total = market + c;
        const lev = (market * 2) / total;
        document.getElementById('valMarket').innerText = '$' + Math.round(market).toLocaleString();
        document.getElementById('valLev').innerText = lev.toFixed(2);
        document.getElementById('actionBox').innerHTML = `<div style="font-size:0.9rem;">再平衡交易指示</div><div style="font-size:1.3rem; font-weight:900; color:#38bdf8; margin-top:5px;">賣出 297.3 股</div>`;
    }
</script>
</body>
</html>
