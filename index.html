<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Terry 資產配置小工具</title>
    <style>
        /* 週期延長至 30s，極致的緩慢呼吸感 */
        @keyframes zen-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body { 
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #e5e7eb, #bfdbfe, #fed7aa, #d9f99d, #e5e7eb);
            background-size: 500% 500%; animation: zen-flow 30s ease infinite; /* 這裡調整為 30秒 */
            display: flex; justify-content: center; align-items: center; padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif; color: #1f2937;
        }
        .card { 
            width: 100%; max-width: 450px; background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); border-radius: 24px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.5);
        }
        h1 { text-align: center; font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; color: #111827; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        input { 
            background: rgba(243, 244, 246, 0.9); border: 1px solid #d1d5db;
            padding: 10px; border-radius: 8px; width: 45%; text-align: right; 
            font-weight: 700; color: #111827;
        }
        .btn { 
            width: 100%; padding: 16px; background: #111827; color: white; 
            border: none; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #374151; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .box { background: white; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #e5e7eb; }
        .val { font-size: 1.1rem; font-weight: 800; color: #111827; margin-top: 4px; }
        #status { margin-top: 20px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; }
    </style>
</head>
<body>
<div class="card">
    <h1>Terry 資產配置小工具</h1>
    <div class="row"><label>信貸總額</label><input type="number" id="loan" value="1800000"></div>
    <div class="row"><label>正二股價</label><input type="number" id="price" value="310.3"></div>
    <div class="row"><label>目前股數</label><input type="number" id="shares" value="4223.7"></div>
    <div class="row"><label>目前現金</label><input type="number" id="cash" value="720000"></div>
    <div class="row"><label>目標股票%</label><input type="number" id="target" value="60"></div>
    <button class="btn" onclick="calc()">分析資產配置</button>
    <div id="res" style="display:none;">
        <div class="grid">
            <div class="box"><small style="color:#6b7280">總市值</small><div class="val" id="vMarket">-</div></div>
            <div class="box"><small style="color:#6b7280">資產淨值</small><div class="val" id="vNet">-</div></div>
            <div class="box"><small style="color:#6b7280">股票比例</small><div class="val" id="vStock" style="color:#059669">-</div></div>
            <div class="box"><small style="color:#6b7280">現金比例</small><div class="val" id="vCash" style="color:#d97706">-</div></div>
            <div class="box"><small style="color:#6b7280">槓桿倍數</small><div class="val" id="vLev">-</div></div>
            <div class="box"><small style="color:#6b7280">抗震月數</small><div class="val" id="vMonths">-</div></div>
        </div>
        <div id="status"></div>
        <div style="margin-top:20px; text-align:center; color:#374151;">
            <div id="action" style="font-weight:900; font-size:1.1rem;"></div>
            <div id="details" style="font-size:0.9rem; margin-top:8px;"></div>
        </div>
    </div>
</div>
<script>
    function calc() {
        const p = parseFloat(document.getElementById('price').value);
        const s = parseFloat(document.getElementById('shares').value);
        const c = parseFloat(document.getElementById('cash').value);
        const l = parseFloat(document.getElementById('loan').value);
        const tr = parseFloat(document.getElementById('target').value) / 100;
        const market = p * s;
        const total = market + c;
        const net = total - l;
        const lev = (market * 2) / total;
        document.getElementById('res').style.display = 'block';
        document.getElementById('vMarket').innerText = '$' + Math.round(market).toLocaleString();
        document.getElementById('vNet').innerText = '$' + Math.round(net).toLocaleString();
        document.getElementById('vStock').innerText = ((market/total)*100).toFixed(1) + '%';
        document.getElementById('vCash').innerText = ((c/total)*100).toFixed(1) + '%';
        document.getElementById('vLev').innerText = lev.toFixed(2) + 'x';
        document.getElementById('vMonths').innerText = (c / 40000).toFixed(1) + '月';
        
        const st = document.getElementById('status');
        if(lev > 1.63) { st.innerText = "⚠️ 槓桿過高 (> 1.63)"; st.style.background = "#fee2e2"; st.style.color = "#991b1b"; }
        else if(lev < 0.77) { st.innerText = "💡 需補足現金 (< 0.77)"; st.style.background = "#fef3c7"; st.style.color = "#92400e"; }
        else { st.innerText = "✅ 配置健康"; st.style.background = "#d1fae5"; st.style.color = "#065f46"; }
        
        const diff = (total * tr) - market;
        const qty = Math.abs(diff / p);
        document.getElementById('action').innerText = Math.abs(diff)<100 ? "無需變動" : `${diff > 0 ? "買進" : "賣出"} ${qty.toFixed(1)} 股`;
        document.getElementById('details').innerText = Math.abs(diff)<100 ? "" : `調整後部位：${(diff > 0 ? s + qty : s - qty).toFixed(1)} 股 | 現金：$${Math.round(c - diff).toLocaleString()}`;
    }
</script>
</body>
</html>
